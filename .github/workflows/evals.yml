name: Quality Evals

# Runs the offline eval suite (schema, completeness, groundedness) on PRs
# that change the LLM service, prompt templates, or the eval suite itself.
# The runner uses the deterministic substring judge so this workflow needs
# no LLM credentials and runs purely against committed fixtures + baselines.
# A regression — any category dropping more than EVAL_REGRESSION_THRESHOLD
# below baselines.json — fails the job.

on:
  pull_request:
    paths:
      - 'workers/services/llm_service.py'
      - 'workers/prompts/**'
      - 'workers/models/**'
      - 'workers/evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: workers/requirements.txt

      - name: Install worker dependencies
        run: |
          cd workers
          pip install -r requirements.txt

      - name: Run eval suite
        run: |
          cd workers
          python -m evals.runner --no-phoenix
